name: Architecture CI

on:
  pull_request:
    paths:
      - architecture/**
      - scripts/**
      - tests/**
      - .github/workflows/architecture-ci.yml
      - README.md
      - diagrams/**
      - visuals/**
  push:
    branches:
      - main
    paths:
      - architecture/**
      - scripts/**
      - tests/**
      - .github/workflows/architecture-ci.yml
      - README.md
      - diagrams/**
      - visuals/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run complete unit test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate canonical architecture
        run: bash scripts/validate-architecture.sh

      - name: Render approved architecture SVG previews
        run: bash scripts/render-architecture.sh

      - name: Independently verify preview outputs
        shell: bash
        run: |
          set -euo pipefail
          output_directory=build/architecture-svg
          if [[ -L "${output_directory}" ]] || find "${output_directory}" -type l -print -quit | grep -q .; then
            echo "Error: symbolic links are not allowed in preview output." >&2
            exit 1
          fi
          expected_filenames=(
            trustsender-container-view-key.svg
            trustsender-container-view.svg
            trustsender-system-context-key.svg
            trustsender-system-context.svg
          )
          mapfile -d '' svg_files < <(find "${output_directory}" -type f -name '*.svg' -print0 | sort -z)
          if [[ "${#svg_files[@]}" -ne 4 ]]; then
            echo "Error: expected exactly four SVG files, found ${#svg_files[@]}." >&2
            exit 1
          fi
          for index in "${!expected_filenames[@]}"; do
            svg_file="${svg_files[index]}"
            if [[ "${svg_file##*/}" != "${expected_filenames[index]}" ]]; then
              echo "Error: expected SVG file ${expected_filenames[index]}, found ${svg_file##*/}." >&2
              exit 1
            fi
            test -s "${svg_file}" || {
              echo "Error: empty SVG file: ${svg_file}" >&2
              exit 1
            }
          done
          python3 - "${output_directory}/trustsender-container-view.svg" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          for name, expected in (("width", "5000"), ("height", "2200")):
              observed = root.get(name)
              normalized = observed[:-2] if observed is not None and observed.endswith("px") else observed
              if normalized != expected:
                  raise SystemExit(f"Unexpected Container View SVG {name}: {observed!r}")
          view_box = root.get("viewBox")
          if view_box is None or " ".join(view_box.split()) != "0 0 5000 2200":
              raise SystemExit(f"Unexpected Container View SVG viewBox: {view_box!r}")
          PY
          if [[ -n "$(git status --porcelain --untracked-files=all -- diagrams/ '*.svg')" ]]; then
            echo "Error: generated SVG content was written under diagrams/." >&2
            exit 1
          fi


      - name: Verify published Container View
        shell: bash
        run: |
          set -euo pipefail
          generated_svg=build/architecture-svg/trustsender-container-view.svg
          committed_svg=diagrams/trustsender-container-view.svg
          for svg_file in "${generated_svg}" "${committed_svg}"; do
            if [[ ! -f "${svg_file}" ]] || [[ -L "${svg_file}" ]] || [[ ! -s "${svg_file}" ]]; then
              echo "Error: expected regular, non-symbolic-link, non-empty SVG file: ${svg_file}" >&2
              exit 1
            fi
          done
          python3 - "${generated_svg}" "${committed_svg}" <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          generated_path = Path(sys.argv[1])
          committed_path = Path(sys.argv[2])
          approved_committed_hash = "04730d386c49d66a1fa624e3db8a0fd077b636a3133cf8ec007f54e9090a731e"
          timestamp_re = re.compile(
              rb"(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday), "
              rb"(?:January|February|March|April|May|June|July|August|September|October|November|December) "
              rb"(?:[1-9]|[12][0-9]|3[01]), "
              rb"[0-9]{4} at "
              rb"(?:[1-9]|1[0-2]):[0-5][0-9] "
              rb"(?:AM|PM) Coordinated Universal Time"
          )
          replacement = b"STRUCTURIZR_RENDER_TIMESTAMP"

          def read_svg(path):
              data = path.read_bytes()
              print(f"{path}: raw SHA-256 {hashlib.sha256(data).hexdigest()}")
              return data

          def require_svg_shape(path, data):
              root = ET.fromstring(data)
              if root.tag.rsplit("}", 1)[-1] != "svg":
                  raise SystemExit(f"{path}: root element is not svg")
              if root.get("width") not in {"5000", "5000px"}:
                  raise SystemExit(f"{path}: unexpected width {root.get('width')!r}")
              if root.get("height") not in {"2200", "2200px"}:
                  raise SystemExit(f"{path}: unexpected height {root.get('height')!r}")
              view_box = root.get("viewBox")
              if view_box is None or " ".join(view_box.split()) != "0 0 5000 2200":
                  raise SystemExit(f"{path}: unexpected viewBox {view_box!r}")

          def normalize_timestamp(path, data):
              matches = list(timestamp_re.finditer(data))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected exactly one Structurizr render timestamp, found {len(matches)}")
              return timestamp_re.sub(replacement, data, count=1)

          generated_data = read_svg(generated_path)
          committed_data = read_svg(committed_path)
          committed_hash = hashlib.sha256(committed_data).hexdigest()
          if committed_hash != approved_committed_hash:
              raise SystemExit(f"{committed_path}: unexpected raw SHA-256 {committed_hash}")
          for path, data in ((generated_path, generated_data), (committed_path, committed_data)):
              require_svg_shape(path, data)
          normalized_generated = normalize_timestamp(generated_path, generated_data)
          normalized_committed = normalize_timestamp(committed_path, committed_data)
          if normalized_generated != normalized_committed:
              raise SystemExit("Generated and committed Container View SVG differ after timestamp normalization")
          print("Normalized Container View SVG SHA-256", hashlib.sha256(normalized_committed).hexdigest())
          PY

      - name: Render D2 engineering overview preview
        run: bash scripts/render-d2-overview.sh

      - name: Upload dark-mode SVG previews
        uses: actions/upload-artifact@v4
        with:
          name: trustsender-architecture-dark-svg
          path: build/architecture-svg/*.svg
          if-no-files-found: error
          retention-days: 7
