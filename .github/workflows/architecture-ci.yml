name: Architecture CI

on:
  pull_request:
    paths:
      - architecture/**
      - scripts/**
      - tests/**
      - .github/workflows/architecture-ci.yml
      - README.md
      - diagrams/README.md
  push:
    branches:
      - main
    paths:
      - architecture/**
      - scripts/**
      - tests/**
      - .github/workflows/architecture-ci.yml
      - README.md
      - diagrams/README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run complete unit test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate canonical architecture
        run: bash scripts/validate-architecture.sh

      - name: Render approved architecture SVG previews
        run: bash scripts/render-architecture.sh

      - name: Independently verify preview outputs
        shell: bash
        run: |
          set -euo pipefail
          output_directory=build/architecture-svg
          if [[ -L "${output_directory}" ]] || find "${output_directory}" -type l -print -quit | grep -q .; then
            echo "Error: symbolic links are not allowed in preview output." >&2
            exit 1
          fi
          expected_filenames=(
            trustsender-container-view-key.svg
            trustsender-container-view.svg
            trustsender-system-context-key.svg
            trustsender-system-context.svg
          )
          mapfile -d '' svg_files < <(find "${output_directory}" -type f -name '*.svg' -print0 | sort -z)
          if [[ "${#svg_files[@]}" -ne 4 ]]; then
            echo "Error: expected exactly four SVG files, found ${#svg_files[@]}." >&2
            exit 1
          fi
          for index in "${!expected_filenames[@]}"; do
            svg_file="${svg_files[index]}"
            if [[ "${svg_file##*/}" != "${expected_filenames[index]}" ]]; then
              echo "Error: expected SVG file ${expected_filenames[index]}, found ${svg_file##*/}." >&2
              exit 1
            fi
            test -s "${svg_file}" || {
              echo "Error: empty SVG file: ${svg_file}" >&2
              exit 1
            }
          done
          python3 - "${output_directory}/trustsender-container-view.svg" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          for name, expected in (("width", "5000"), ("height", "2200")):
              observed = root.get(name)
              normalized = observed[:-2] if observed is not None and observed.endswith("px") else observed
              if normalized != expected:
                  raise SystemExit(f"Unexpected Container View SVG {name}: {observed!r}")
          view_box = root.get("viewBox")
          if view_box is None or " ".join(view_box.split()) != "0 0 5000 2200":
              raise SystemExit(f"Unexpected Container View SVG viewBox: {view_box!r}")
          PY
          if [[ -n "$(git status --porcelain --untracked-files=all -- diagrams/ '*.svg')" ]]; then
            echo "Error: generated SVG content was written under diagrams/." >&2
            exit 1
          fi

      - name: Upload dark-mode SVG previews
        uses: actions/upload-artifact@v4
        with:
          name: trustsender-architecture-dark-svg
          path: build/architecture-svg/*.svg
          if-no-files-found: error
          retention-days: 7
